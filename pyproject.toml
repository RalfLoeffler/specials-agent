[tool.black]
line-length = 88
target-version = ["py313"]
extend-exclude = '''
^/abandoned/
'''

[tool.ruff]
line-length = 88
target-version = "py313"
exclude = [
  "abandoned",
]

[tool.jupytext]
formats = "ipynb,py:percent"
notebook_metadata_filter = "-all"
cell_metadata_filter = "-all"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
    "B",  # flake8-bugbear
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"